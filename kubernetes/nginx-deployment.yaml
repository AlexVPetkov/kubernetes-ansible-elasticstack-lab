apiVersion: v1
kind: Namespace
metadata:
  name: banking-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-web
  namespace: banking-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-web
  template:
    metadata:
      labels:
        app: banking-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: banking-web-service
  namespace: banking-lab
spec:
  type: ClusterIP
  selector:
    app: banking-web
  ports:
    - port: 80
      targetPort: 80