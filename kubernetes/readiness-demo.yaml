
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-readiness-demo
  namespace: banking-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-readiness-demo
  template:
    metadata:
      labels:
        app: banking-readiness-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: banking-readiness-service
  namespace: banking-lab
spec:
  selector:
    app: banking-readiness-demo
  ports:
    - port: 80
      targetPort: 80
