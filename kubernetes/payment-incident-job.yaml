
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-incident-simulator
  namespace: banking-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: payment-incident-simulator
    spec:
      restartPolicy: Never
      containers:
        - name: incident-simulator
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Starting simulated payment incident"

              counter=1
              while [ "$counter" -le 100 ]; do
                timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

                echo "$timestamp ERROR payment-worker payment_processing_failed incident=INC-002 transaction=SPIKE-$counter"

                counter=$((counter + 1))
                sleep 1
              done

              echo "Simulated payment incident completed"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
