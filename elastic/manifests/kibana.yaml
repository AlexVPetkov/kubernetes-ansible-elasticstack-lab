
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: banking-kibana
  namespace: elastic-system
spec:
  version: 9.2.3
  count: 1
  elasticsearchRef:
    name: banking-elasticsearch
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1Gi
